name: Alpaca Trading Bot

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes, 24/7
  workflow_dispatch:         # also lets you trigger it manually in GitHub UI

permissions:
  contents: write   # needed so the workflow can commit trades.xlsx back to the repo

concurrency:
  group: alpaca-trading-bot
  cancel-in-progress: false   # let an overlapping run wait instead of racing the live trade

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 4       # kill if it hangs before the next run starts

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run trading cycle
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL: https://paper-api.alpaca.markets
        run: python run_once.py

      - name: Commit updated trade log
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          if [ -f trades.xlsx ]; then
            git add trades.xlsx
            git diff --cached --quiet && echo "No new trades this cycle." || \
              (git commit -m "Update trade log [skip ci]" && git pull --rebase && git push)
          else
            echo "No trades yet — trades.xlsx not created."
          fi
